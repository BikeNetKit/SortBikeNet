name: sbnenvdev
channels:
  - conda-forge
dependencies:
  - python>=3.12
  - matplotlib
  - osmnx>=1.9.4
  - geopandas>=0.14

  # additional to the non-dev env
  - ipykernel
  - ipywidgets
  - pytest
  - pytest-mpl
  - pytest-cov
  - sphinx
  - numpydoc
  - myst-nb
  - pre-commit
  - jupyterlab
  - pixi-kernel
  - pip:
      # not available via conda-forge:
      - sphinx-copybutton
      - sphinxext-opengraph
      - furo
      - sortbikenet # For docs, get latest version fast from pypi