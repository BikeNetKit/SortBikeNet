[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sortbikenet"
version = "0.6.0"
authors = [
    { name = "Clément Sebastiao" },
  { name = "Manuel Knepper" },
  { name = "Michael Szell", email = "michael@szell.net" },
]
maintainers = [
    { name = "Michael Szell", email = "michael@szell.net"},
]
license = "AGPL-3.0-or-later"
readme = "README.md"
description = "BikeNetKit Python package to prioritize developments in planned bicycle networks"
keywords = ["Bicycle network planning", "Networks", "OpenStreetMap", "Urban Planning", "Urban Mobility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=0.14",
    "matplotlib",
    "osmnx>=1.9.4",
]

[project.urls]
Homepage = "https://bikenetkit.org/sortbikenet"
Documentation = "https://docs.bikenetkit.org/SortBikeNet"
Repository = "https://github.com/BikeNetKit/SortBikeNet"
Issues = "https://github.com/BikeNetKit/SortBikeNet/issues"
Changelog = "https://docs.bikenetkit.org/SortBikeNet/changelog"

[project.optional-dependencies]
test = ["pytest"]
doc = ["sphinx"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]  # "Imported but unused: happens with packages

[tool.setuptools.packages.find]
exclude = [
    "examples*",
    "tests*",
    "results",
    "docs*",
    "data*",
    "scripts*",
]
namespaces = false